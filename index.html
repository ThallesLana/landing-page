    <!--
      Intro (ver src/components/layout/Intro.tsx): liga só na primeira visita a cada 30 dias
      e nunca com movimento reduzido. Roda antes do CSS para não piscar o site antes da abertura.
    -->
    <script>
      ;(function () {
        var on = false
        try {
          var key = 'thalles-lana:intro'
          var last = Number(localStorage.getItem(key)) || 0
          var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
          on = !reduce && Date.now() - last > 30 * 864e5
          if (on) localStorage.setItem(key, String(Date.now()))
        } catch (e) {}
        document.documentElement.dataset.intro = on ? 'on' : 'off'
      })()
    </script>
